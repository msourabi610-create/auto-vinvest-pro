    <!-- FontAwesome -->

        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-dark-900 text-gray-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-black">

    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="flex-1 flex flex-col">
        <!-- Dynamic views rendered via JavaScript -->
    </div>
        <!-- JavaScript Application Logic -->
    <script>

            ],

                {

                }
            ],
            deposits: [
                {
                    id: 'dep_demo1',
                    userId: 'usr_demo1',
                    userName: 'Jean Kouassi',
                    amount: 50000,
                    method: 'Orange Money CI',
                    reference: 'OM-987654321',
                    date: new Date(Date.now() - 3600000).toISOString(),
                    status: 'pending'
                }
            ],
            withdrawals: [
                {
                    id: 'wit_demo1',
                    userId: 'usr_demo1',
                    userName: 'Jean Kouassi',
                    amount: 15000,
                    method: 'MTN Mobile Money',
                    phone: '+225 0700000000',
                    date: new Date(Date.now() - 7200000).toISOString(),
                    status: 'pending'
                }
            ],
            session: null
        };

        function getDB() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (!data) {
                saveDB(defaultDb);
                return defaultDb;
            }
            return JSON.parse(data);
        }

        function saveDB(db) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-blue-600';
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            
            toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 pointer-events-auto transform translate-y-2 opacity-0 transition-all duration-300`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span class="text-sm font-medium">${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 50);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
        function renderApp() {
            const db = getDB();
            const app = document.getElementById('app');

            if (!db.session) {
                app.innerHTML = renderAuthView();
                initAuthListeners();
            } else if (db.session.role === 'admin') {
                app.innerHTML = renderAdminDashboard(db);
                initAdminListeners(db);
            } else {
                app.innerHTML = renderUserDashboard(db);
                initUserListeners(db);
            }
        }

        // VUE AUTHENTIFICATION (Connexion / Inscription)
        let authMode = 'login'; // 'login' ou 'register'
        function renderAuthView() {
            return `
            <div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-gradient-to-br from-dark-900 via-dark-800 to-amber-950/30">
                <!-- Cercles lumineux d'arrière-plan -->
                <div class="absolute -top-40 -left-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

                <div class="w-full max-w-md bg-dark-800/90 backdrop-blur-xl border border-gray-700/60 rounded-3xl p-8 shadow-2xl relative z-10">
                    <div class="text-center mb-8">
                        <div class="w-16 h-16 bg-gradient-to-tr from-amber-500 to-yellow-300 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-amber-500/20 mb-4">
                            <i class="fa-solid fa-car-side text-dark-900 text-3xl"></i>
                        </div>
                        <h1 class="text-2xl font-bold tracking-tight text-white">AutoInvest <span class="text-amber-400">Pro</span></h1>
                        <p class="text-sm text-gray-400 mt-1">Investissez dans de vrais véhicules et encaissez vos gains</p>
                    </div>

                    <!-- Sélecteur de mode -->
                    <div class="flex bg-dark-900 p-1.5 rounded-xl mb-6 border border-gray-700/50">
                        <button id="tab-login" onclick="switchAuthMode('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all ${authMode === 'login' ? 'bg-amber-500 text-dark-900 shadow-md' : 'text-gray-400 hover:text-white'}">Connexion</button>
                        <button id="tab-register" onclick="switchAuthMode('register')" class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all ${authMode === 'register' ? 'bg-amber-500 text-dark-900 shadow-md' : 'text-gray-400 hover:text-white'}">Inscription</button>
                    </div>

                    <form id="auth-form" class="space-y-4">
                        ${authMode === 'register' ? `
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Nom complet</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-500"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" id="reg-name" required placeholder="Ex: Jean Kouassi" class="w-full pl-10 pr-4 py-3 bg-dark-900 border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-amber-500 transition-colors text-sm">
                                </div>
                            </div>
                        ` : ''}

                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Adresse Email</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-500"><i class="fa-solid fa-envelope"></i></span>
                                <input type="email" id="auth-email" required placeholder="votre@email.com" class="w-full pl-10 pr-4 py-3 bg-dark-900 border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-amber-500 transition-colors text-sm">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1.5">Mot de passe</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-500"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" id="auth-password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 bg-dark-900 border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-amber-500 transition-colors text-sm">
                            </div>
                        </div>

                        ${authMode === 'login' ? `
                            <div class="flex items-center justify-between text-xs text-gray-400 pt-1">
                                <span>Admin test : <strong class="text-amber-400">msourabi610@gmail.com</strong> / <strong class="text-amber-400">00000</strong></span>
                            </div>
                        ` : ''}

                        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-400 hover:to-yellow-300 text-dark-900 font-bold rounded-xl shadow-lg shadow-amber-500/20 transition-all transform active:scale-95 text-sm uppercase tracking-wider">
                            ${authMode === 'login' ? 'Se connecter' : 'Créer mon compte'}
                        </button>
                    </form>
                </div>
            </div>`;
        }

        function switchAuthMode(mode) {
            authMode = mode;
            renderApp();
        }

        function initAuthListeners() {
            const form = document.getElementById('auth-form');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('auth-email').value.trim();
                const password = document.getElementById('auth-password').value.trim();
                const db = getDB();

                if (authMode === 'login') {
                    const user = db.users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);
                    if (user) {
                        db.session = user;
                        saveDB(db);
                        showToast(`Bienvenue ${user.name} !`, 'success');
                        renderApp();
                    } else {
                        showToast('Email ou mot de passe incorrect.', 'error');
                    }
                } else {
                    const name = document.getElementById('reg-name').value.trim();
                    if (db.users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
                        showToast('Cet email est déjà utilisé.', 'error');
                        return;
                    }
                    const newUser = {
                        id: 'usr_' + Date.now(),
                        name,
                        email,
                        password,
                        role: 'user',
                        balance: 0,
                        totalInvested: 0,
                        totalEarned: 0,
                        createdAt: new Date().toISOString()
                    };
                    db.users.push(newUser);
                    db.session = newUser;
                    saveDB(db);
                    showToast('Compte créé avec succès ! Bienvenue sur AutoInvest.', 'success');
                    renderApp();
                }
            });
        }
        let activeAdminTab = 'deposits'; // 'deposits', 'withdrawals', 'users', 'vehicles'

        function renderAdminDashboard(db) {
            const pendingDeposits = db.deposits.filter(d => d.status === 'pending');
            const pendingWithdrawals = db.withdrawals.filter(w => w.status === 'pending');
            
            return `
            <div class="flex-1 flex flex-col md:flex-row bg-dark-900">
                <!-- Sidebar Admin -->
                <aside class="w-full md:w-64 bg-dark-800 border-r border-gray-800 flex flex-col">
                    <div class="p-6 border-b border-gray-800 flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gradient-to-tr from-rose-500 to-amber-500 rounded-xl flex items-center justify-center font-bold text-dark-900">
                            <i class="fa-solid fa-shield-halved"></i>
                        </div>
                        <div>
                            <h2 class="font-bold text-white text-sm">Panneau Admin</h2>
                            <p class="text-xs text-rose-400">Mode Administrateur</p>
                        </div>
                    </div>

                    <nav class="p-4 space-y-1.5 flex-1">
                        <button onclick="setAdminTab('deposits')" class="w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-medium transition-all ${activeAdminTab === 'deposits' ? 'bg-amber-500 text-dark-900 font-semibold shadow-lg shadow-amber-500/10' : 'text-gray-400 hover:bg-dark-700 hover:text-white'}">
                            <span class="flex items-center space-x-3"><i class="fa-solid fa-money-bill-transfer w-5"></i><span>Dépôts à valider</span></span>
                            ${pendingDeposits.length > 0 ? `<span class="bg-rose-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">${pendingDeposits.length}</span>` : ''}
                        </button>
                        <button onclick="setAdminTab('withdrawals')" class="w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-medium transition-all ${activeAdminTab === 'withdrawals' ? 'bg-amber-500 text-dark-900 font-semibold shadow-lg shadow-amber-500/10' : 'text-gray-400 hover:bg-dark-700 hover:text-white'}">
                            <span class="flex items-center space-x-3"><i class="fa-solid fa-wallet w-5"></i><span>Retraits</span></span>
                            ${pendingWithdrawals.length > 0 ? `<span class="bg-rose-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">${pendingWithdrawals.length}</span>` : ''}
                        </button>
                        <button onclick="setAdminTab('users')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${activeAdminTab === 'users' ? 'bg-amber-500 text-dark-900 font-semibold shadow-lg' : 'text-gray-400 hover:bg-dark-700 hover:text-white'}">
                            <i class="fa-solid fa-users w-5"></i><span>Utilisateurs (${db.users.length})</span>
                        </button>
                        <button onclick="setAdminTab('vehicles')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${activeAdminTab === 'vehicles' ? 'bg-amber-500 text-dark-900 font-semibold shadow-lg' : 'text-gray-400 hover:bg-dark-700 hover:text-white'}">
                            <i class="fa-solid fa-car w-5"></i><span>Catalogue Flotte</span>
                        </button>
                    </nav>

                    <div class="p-4 border-t border-gray-800">
                        <button onclick="logout()" class="w-full flex items-center justify-center space-x-2 py-2.5 bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white rounded-xl text-sm font-medium transition-all">
                            <i class="fa-solid fa-right-from-bracket"></i><span>Déconnexion</span>
                        </button>
                    </div>
                </aside>

                <!-- Contenu Principal Admin -->
                <main class="flex-1 p-6 md:p-8 overflow-y-auto">
                    <header class="flex flex-col md:flex-row md:items-center justify-between pb-6 border-b border-gray-800 mb-6 gap-4">
                        <div>
                            <h1 class="text-2xl font-bold text-white capitalize">${activeAdminTab === 'deposits' ? 'Gestion des Dépôts en attente' : activeAdminTab === 'withdrawals' ? 'Demandes de Retrait' : activeAdminTab === 'users' ? 'Liste des Utilisateurs Inscrits' : 'Gestion de la Flotte de Véhicules'}</h1>
                            <p class="text-sm text-gray-400">Validez instantanément les transactions pour créditer les comptes réels.</p>
                        </div>
                        <div class="flex items-center space-x-3">
                            <div class="bg-dark-800 border border-gray-700 px-4 py-2 rounded-xl text-xs flex items-center space-x-2">
                                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                <span class="text-gray-300">Admin: <strong>msourabi610@gmail.com</strong></span>
                            </div>
                        </div>
                    </header>

                    ${activeAdminTab === 'deposits' ? renderAdminDeposits(db) :
                      activeAdminTab === 'withdrawals' ? renderAdminWithdrawals(db) :
                      activeAdminTab === 'users' ? renderAdminUsers(db) : renderAdminVehicles(db)}
                </main>
            </div>`;
        }

        function setAdminTab(tab) {
            activeAdminTab = tab;
            renderApp();
        }

        function renderAdminDeposits(db) {
            const deposits = db.deposits;
            if (deposits.length === 0) {
                return `<div class="bg-dark-800/50 border border-gray-800 rounded-2xl p-12 text-center text-gray-500">Aucun dépôt enregistré pour le moment.</div>`;
            }

            return `
            <div class="bg-dark-800 border border-gray-700/60 rounded-2xl overflow-hidden shadow-xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-dark-900/60 border-b border-gray-700 text-xs uppercase tracking-wider text-gray-400">
                                <th class="p-4">Utilisateur</th>
                                <th class="p-4">Montant</th>
                                <th class="p-4">Méthode / Ref</th>
                                <th class="p-4">Date</th>
                                <th class="p-4">Statut</th>
                                <th class="p-4 text-right">Actions instantanées</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-800 text-sm">
                            ${deposits.map(d => `
                                <tr class="hover:bg-dark-700/40 transition-colors">
                                    <td class="p-4 font-medium text-white">${d.userName}</td>
                                    <td class="p-4 font-bold text-amber-400">${d.amount.toLocaleString()} FCFA</td>
                                    <td class="p-4 text-gray-300">
                                        <div class="font-medium">${d.method}</div>
                                        <div class="text-xs text-gray-500 font-mono">${d.reference}</div>
                                    </td>
                                    <td class="p-4 text-gray-400 text-xs">${new Date(d.date).toLocaleString()}</td>
                                    <td class="p-4">
                                        ${d.status === 'pending' ? '<span class="px-2.5 py-1 bg-amber-500/10 text-amber-400 text-xs rounded-full font-medium border border-amber-500/20">En attente</span>' :
                                          d.status === 'approved' ? '<span class="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 text-xs rounded-full font-medium border border-emerald-500/20">Validé</span>' :
                                          '<span class="px-2.5 py-1 bg-rose-500/10 text-rose-400 text-xs rounded-full font-medium border border-rose-500/20">Refusé</span>'}
                                    </td>
                                    <td class="p-4 text-right space-x-2">
                                        ${d.status === 'pending' ? `
                                            <button onclick="validateDeposit('${d.id}', true)" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold shadow transition-all">
                                                <i class="fa-solid fa-check mr-1"></i> Valider
                                            </button>
                                            <button onclick="validateDeposit('${d.id}', false)" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-white rounded-lg text-xs font-semibold shadow transition-all">
                                                <i class="fa-solid fa-xmark mr-1"></i> Rejeter
                                            </button>
                                        ` : '<span class="text-xs text-gray-500 italic">Traité</span>'}
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`;
        }

        function validateDeposit(depositId, isApproved) {
            const db = getDB();
            const dep = db.deposits.find(d => d.id === depositId);
            if (!dep || dep.status !== 'pending') return;

            dep.status = isApproved ? 'approved' : 'rejected';

            if (isApproved) {
                const user = db.users.find(u => u.id === dep.userId);
                if (user) {
                    user.balance += dep.amount;
                    showToast(`Dépôt de ${dep.amount.toLocaleString()} FCFA validé ! Solde de ${user.name} crédité.`, 'success');
                }
            } else {
                showToast('Dépôt rejeté.', 'info');
            }

            saveDB(db);
            renderApp();
        }

        function renderAdminWithdrawals(db) {
            const withdrawals = db.withdrawals;
            if (withdrawals.length === 0) {
                return `<div class="bg-dark-800/50 border border-gray-800 rounded-2xl p-12 text-center text-gray-500">Aucune demande de retrait.</div>`;
            }

            return `
            <div class="bg-dark-800 border border-gray-700/60 rounded-2xl overflow-hidden shadow-xl">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-dark-900/60 border-b border-gray-700 text-xs uppercase tracking-wider text-gray-400">
                            <th class="p-4">Utilisateur</th>
                            <th class="p-4">Montant</th>
                            <th class="p-4">Moyen / Téléphone</th>
                            <th class="p-4">Date</th>
                            <th class="p-4">Statut</th>
                            <th class="p-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-800 text-sm">
                        ${withdrawals.map(w => `
                            <tr class="hover:bg-dark-700/40 transition-colors">
                                <td class="p-4 font-medium text-white">${w.userName}</td>
                                <td class="p-4 font-bold text-rose-400">-${w.amount.toLocaleString()} FCFA</td>
                                <td class="p-4 text-gray-300">${w.method} (${w.phone})</td>
                                <td class="p-4 text-gray-400 text-xs">${new Date(w.date).toLocaleString()}</td>
                                <td class="p-4">
                                    ${w.status === 'pending' ? '<span class="px-2.5 py-1 bg-amber-500/10 text-amber-400 text-xs rounded-full font-medium border border-amber-500/20">En attente</span>' :
                                      w.status === 'approved' ? '<span class="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 text-xs rounded-full font-medium border border-emerald-500/20">Payé</span>' :
                                      '<span class="px-2.5 py-1 bg-rose-500/10 text-rose-400 text-xs rounded-full font-medium border border-rose-500/20">Refusé</span>'}
                                </td>
                                <td class="p-4 text-right space-x-2">
                                    ${w.status === 'pending' ? `
                                        <button onclick="processWithdrawal('${w.id}', true)" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold shadow">Payer</button>

            const db = getDB();
            const w = db.withdrawals.find(item => item.id === id);
            if (!w || w.status !== 'pending') return;

            w.status = approved ? 'approved' : 'rejected';
            if (!approved) {
                const user = db.users.find(u => u.id === w.userId);
                if (user) user.balance += w.amount;
                showToast('Retrait rejeté et fonds remboursés au client.', 'info');

            }
            saveDB(db);
            renderApp();

        function investInVehicle(vehicleId) {
            const db = getDB();

            if (!user || !vehicle) return;

            if (user.balance < vehicle.price) {
                showToast(`Solde insuffisant (${user.balance.toLocaleString()} FCFA). Veuillez effectuer un dépôt.`, 'error');
                setUserTab('wallet');
                return;
            }

            user.balance -= vehicle.price;
            user.totalInvested = (user.totalInvested || 0) + vehicle.price;

            const newInvestment = {
                id: 'inv_' + Date.now(),
                userId: user.id,
                userName: user.name,
                vehicleId: vehicle.id,
                vehicleName: vehicle.name,
                amount: vehicle.price,
                dailyReturn: vehicle.dailyReturn,
                daysRemaining: vehicle.durationDays,
                totalCollected: 0,
                startDate: new Date().toISOString(),
                status: 'active'
            };

            db.investments.push(newInvestment);
            db.session = user;
            saveDB(db);

            showToast(`Félicitations ! Vous possédez désormais un(e) ${vehicle.name}.`, 'success');
            setUserTab('my_investments');

                    db.session = user;
                    saveDB(db);
                    showToast('Demande de retrait enregistrée avec succès.', 'success');
                    setUserTab('history');
                });
            }
        }

        function logout() {
            const db = getDB();
            db.session = null;
            saveDB(db);
            showToast('Déconnexion réussie.', 'info');
            renderApp();
        }

        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
